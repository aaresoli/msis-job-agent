[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hope-job-agent"
version = "0.2.0"
description = "Local-first Kelley HOPE MSIS career-intelligence platform."
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Kelley HOPE MSIS Job Agent Team" }
]
# Floors track what the project is actually developed and tested against.
# They were previously up to two major versions behind the installed set --
# `langgraph>=0.2` while 1.x was in use -- which let an unpinned CI install
# resolve an API that no longer exists and still report success.
dependencies = [
  "alembic>=1.18",
  "celery[redis]>=5.6",
  "fastapi>=0.139",
  "httpx>=0.28",
  "langgraph>=1.2",
  "langgraph-checkpoint-postgres>=3.1",
  "minio>=7.2",
  "opentelemetry-exporter-otlp-proto-http>=1.44",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "prometheus-fastapi-instrumentator>=8.0",
  "redis>=6.4",
  "openpyxl>=3.1",
  "pgvector>=0.5",
  "psycopg[binary]>=3.3",
  "pydantic>=2.13",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "python-docx>=1.2",
  "pypdf>=6.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0.40",
  "uvicorn>=0.51"
]

# PEP 735. Not installed by `pip install <project>`, and not published as
# extras, which is what development tooling should be.
[dependency-groups]
dev = [
  "black>=26.5",
  "mypy>=2.3",
  "pytest>=9.1",
  "pytest-cov>=7.0",
  "ruff>=0.15"
]

[project.scripts]
hope-job-agent = "hope_job_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_job_agent"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/hope_job_agent/api/*.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-q --capture=sys --cov=hope_job_agent --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast tests with no external services",
  "integration: cross-module tests that may touch the local filesystem",
  "postgres: tests that require a live PostgreSQL instance with pgvector",
]

[tool.coverage.run]
source = ["hope_job_agent"]
branch = true

[tool.coverage.report]
# Measured 71.7% with branch coverage on. The floor sits just below that so
# the suite cannot silently regress, with room for ordinary churn. Raise it as
# coverage improves rather than treating it as a target to sit at.
fail_under = 70
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.14"
packages = ["hope_job_agent"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
