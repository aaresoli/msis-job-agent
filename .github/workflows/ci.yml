name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --frozen fails rather than silently re-resolving, so CI installs the
      # exact set recorded in uv.lock and a stale lockfile is a visible error.
      - name: Install
        run: uv sync --frozen
      - name: Lockfile is current
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Mypy
        run: uv run mypy src
      - name: Tests
        run: uv run python -m pytest
      - name: Migration and n8n contracts
        run: |
          uv run alembic upgrade head --sql > "$RUNNER_TEMP/migration.sql"
          uv run python scripts/validate_n8n_workflows.py
          uv run python scripts/import_n8n_workflows.py --check
      - name: MVP pipeline smoke test
        run: |
          uv run python -m hope_job_agent.pipeline.run_mvp \
            --source approved_json \
            --input data/sample_jobs.json \
            --profiles data/sample_profiles.json \
            --output "$RUNNER_TEMP/mvp_results.csv" \
            --limit 2 \
            --database-url "sqlite:///$RUNNER_TEMP/mvp.sqlite3"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
