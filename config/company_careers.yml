# Company Careers source configuration (public ATS job boards).
#
# This file drives the `company_careers` source. Graduate Career Services can
# add, disable, or reprioritize employers here without editing Python.
#
# Compliance (see docs/company_careers.md and docs/compliance_notes.md):
#   - Public employer career pages and public ATS APIs only.
#   - No LinkedIn/Handshake or any logged-in/account-gated collection.
#   - No CAPTCHA solving, login automation, proxy evasion, or access bypass.
#   - Respect robots.txt, rate limit, and send a clear User-Agent.
#   - A source that blocks the crawler is disabled automatically.
#
# Provider -> which field holds the ATS identifier:
#   greenhouse       -> ats_slug = board token
#   lever            -> ats_slug = site name
#   ashby            -> ats_slug = job-board name
#   smartrecruiters  -> ats_slug = company identifier
#   workday          -> host + tenant + site
#
# All ATS endpoints below were verified as public (HTTP 200, JSON) during setup.

fetch_policy:
  user_agent: "KelleyHOPE-MSIS-JobAgent/0.1 (+https://kelley.iu.edu; compliant public career-page reader)"
  min_interval_seconds: 1.0
  timeout_seconds: 15.0
  max_retries: 2
  backoff_seconds: 0.5
  max_jobs_per_company: 200
  max_total_jobs_per_run: 2000
  respect_robots: true
  fetch_descriptions: true

# Keep score >= this to retain a posting (see relevance.py scoring).
relevance_threshold: 3

companies:
