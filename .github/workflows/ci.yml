name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Black
        run: python -m black --check .
      - name: Mypy
        run: python -m mypy src
      - name: Tests
        run: python -m pytest
      - name: MVP pipeline smoke test
        run: |
          python -m hope_job_agent.pipeline.run_mvp \
            --source approved_json \
            --input data/sample_jobs.json \
            --profiles data/sample_profiles.json \
            --output "$RUNNER_TEMP/mvp_results.csv" \
            --limit 2 \
            --database-url "sqlite:///$RUNNER_TEMP/mvp.sqlite3"
