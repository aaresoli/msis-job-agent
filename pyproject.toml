[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-job-agent"
version = "0.2.0"
description = "Local-first Kelley HOPE MSIS career-intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Kelley HOPE MSIS Job Agent Team" }
]
dependencies = [
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "fastapi>=0.111.0",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "minio>=7.2",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "prometheus-fastapi-instrumentator>=7.0",
  "redis>=5.0",
  "openpyxl>=3.1",
  "pgvector>=0.3",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.4.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[project.scripts]
hope-job-agent = "hope_job_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/hope_job_agent/api/*.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-q --capture=sys"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast tests with no external services",
  "integration: cross-module tests that may touch the local filesystem",
  "postgres: tests that require a live PostgreSQL instance with pgvector",
]

[tool.mypy]
python_version = "3.11"
packages = ["hope_job_agent"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
